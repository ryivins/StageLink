<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageLink | Resume Builder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav aria-label="Main Navigation">
        <h1>StageLink</h1>
        <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="README.md">About</a></li>
                <li><a href="jobs.html">Jobs</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="myprofile.html">My Profile</a></li>
        </ul>
    </nav>
</header>

<main>

<section id="resumeBuilder">
    <h2>Create Your Professional Profile</h2>
    <p>Build your StageLink resume</p>

    <form id="resumeForm">

        <!-- =========================
             BASIC INFORMATION
        ========================== -->
        <h3>Basic Information</h3>

        <label>Full Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Phone Number</label>
        <input type="tel" id="phone">

        <label>Location (City, State)</label>
        <input type="text" id="location">

        <!-- =========================
             PROFESSIONAL DETAILS
        ========================== -->
        <h3>Professional Details</h3>

        <label>Primary Role</label>
        <select id="role" required>
            <option value="">Select Role</option>
            <option>Stage Manager</option>
            <option>Audio Engineer</option>
            <option>Lighting Designer</option>
            <option>Performer</option>
            <option>Tour Manager</option>
            <option>Producer</option>
        </select>

        <label>Years of Experience</label>
        <input type="number" id="experienceYears" min="0">

        <label>Industry Focus (Genre)</label>
        <select id="genre" required>
            <option value="">Select Genre</option>
            <option>Jazz</option>
            <option>Rock</option>
            <option>Rap</option>
            <option>Metal</option>
            <option>R&B</option>
            <option>EDM</option>
            <option>Country</option>
            <option>Latin</option>
            <option>Pop</option>
            <option>All Genres</option>
        </select>

        <label>Work Availability</label>
        <select id="availability">
            <option>Full-time</option>
            <option>Part-time</option>
            <option>Freelance</option>
            <option>Touring</option>
        </select>

        <!-- =========================
             SKILLS & EXPERIENCE
        ========================== -->
        <h3>Experience & Skills</h3>

        <label>Professional Summary</label>
        <textarea id="summary" placeholder="Short professional summary..."></textarea>

        <label>Technical Skills</label>
        <input type="text" id="skills" placeholder="Live sound, cue calling, lighting boards">

        <label>Previous Experience</label>
        <textarea id="experience" placeholder="List past productions, venues, or tours..."></textarea>

        <label>Education / Training</label>
        <textarea id="education"></textarea>

        <!-- =========================
             RESUME UPLOAD
        ========================== -->
        <h3>Upload Existing Resume</h3>

        <label>Upload Resume (PDF, DOC, DOCX)</label>
        <input type="file" id="resumeUpload" accept=".pdf,.doc,.docx">

        <p id="fileNamePreview" style="margin-top:8px; font-size:14px; color:#666;"></p>

        <!-- =========================
             SUBMIT
        ========================== -->
        <button type="submit">Generate Profile</button>

    </form>

    <div id="resumeOutput"></div>
</section>

</main>

<script src="resume.js"></script>

</body>
</html>

<    <header>
        <link rel="stylesheet" href="style.css">
        <nav aria-label="Main Navigation">
            <h1>StageLink</h1>
            <ul>
                <li><a href="#about">About</a></li>

section id="resumeBuilder">
    <h2>Create Your Professional Profile</h2>
    <p>Build your StageLink resume </p>

    <form id="resumeForm">

        <h3>Basic Information</h3>

        <label>Full Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Phone Number</label>
        <input type="tel" id="phone">

        <label>Location (City, State)</label>
        <input type="text" id="location">

        <h3>Professional Details</h3>

        <label>Primary Role</label>
        <select id="role" required>
            <option value="">Select Role</option>
            <option>Stage Manager</option>
            <option>Audio Engineer</option>
            <option>Lighting Designer</option>
            <option>Performer</option>
            <option>Tour Manager</option>
            <option>Producer</option>
        </select>

        <label>Years of Experience</label>
        <input type="number" id="experienceYears" min="0">

        <label>Industry Focus (Genre)</label>
        <select id="genre" required>
            <option value="">Select Genre</option>
            <option>Musical</option>
            <option>Drama</option>
            <option>Comedy</option>
            <option>Rock</option>
            <option>Pop</option>
            <option>EDM</option>
        </select>

        <label>Work Availability</label>
        <select id="availability">
            <option>Full-time</option>
            <option>Part-time</option>
            <option>Freelance</option>
            <option>Touring</option>
        </select>

        <h3>Experience & Skills</h3>

        <label>Summary</label>
        <textarea id="summary" placeholder="Short professional summary..."></textarea>

        <label>Skills (comma separated)</label>
        <input type="text" id="skills" placeholder="e.g. Live sound, stage cues, lighting boards">

        <label>Previous Experience</label>
        <textarea id="experience" placeholder="List past productions, venues, or tours..."></textarea>

        <label>Education / Training</label>
        <textarea id="education"></textarea>

        <button type="submit">Generate Profile</button>
    </form>

    <div id="resumeOutput"></div>
</section>
